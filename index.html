  <style>

    *{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.45}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.app{max-width:1100px;margin:0 auto;min-height:100dvh;padding-bottom:calc(88px + var(--safe-bottom))}.topbar{padding:calc(18px + env(safe-area-inset-top,0px)) 20px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #24323c;background:var(--bg)}.brand{display:flex;align-items:center;gap:12px}.mark{width:43px;height:43px;border-radius:14px;background:linear-gradient(145deg,#3188d7,#174b7b);display:grid;place-items:center;font-weight:800;letter-spacing:-1px;color:white}.eyebrow{color:var(--muted);font-size:11px;letter-spacing:1.2px;text-transform:uppercase}.brand h1{font-size:20px;margin:1px 0 0;letter-spacing:-.5px}.top-actions{display:flex;gap:8px}.icon-btn,.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px 13px}.icon-btn{width:42px;height:42px;padding:0;display:grid;place-items:center;font-size:18px}.btn.primary{background:var(--blue);color:#09233a;border-color:var(--blue);font-weight:750}.btn.ghost{background:transparent}.btn.danger{color:var(--red)}main{padding:20px}.vehicle{position:relative;overflow:hidden;display:grid;grid-template-columns:1.15fr .85fr;gap:8px;background:linear-gradient(125deg,#1d3446,#17232d 65%);border:1px solid #304655;border-radius:24px;padding:22px;margin-bottom:18px;min-height:180px}.vehicle:after{content:"E39";position:absolute;right:15px;bottom:-30px;font-size:110px;font-weight:900;color:#ffffff08;letter-spacing:-8px;pointer-events:none}.vehicle h2{font-size:27px;letter-spacing:-1px;margin:5px 0 4px}.vehicle p{color:#b4c7d5;margin:0;font-size:13px}.vehicle .meta{margin-top:16px;display:flex;flex-wrap:wrap;gap:7px}.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:100px;background:#2b4354;color:#c7e4ff;font-size:11px;font-weight:650}.car-art{align-self:center;justify-self:center;width:100%;max-width:250px;z-index:1}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:23px 0 12px}.section-head h2{font-size:18px;margin:0;letter-spacing:-.3px}.section-head .sub{font-size:12px;color:var(--muted);margin-top:2px}.stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{border:1px solid var(--line);border-radius:17px;padding:15px;background:var(--panel);min-width:0}.stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;gap:5px}.stat-icon{width:29px;height:29px;display:grid;place-items:center;background:var(--panel2);border-radius:10px;color:var(--blue);font-size:15px}.stat-value{font-size:22px;font-weight:780;letter-spacing:-.7px;margin:12px 0 3px;overflow-wrap:anywhere}.stat-note{font-size:11px;color:var(--muted)}.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.quick{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:15px;padding:14px 5px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px}.quick span:first-child{font-size:22px;color:var(--blue)}.card-list{display:flex;flex-direction:column;gap:9px}.item{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:flex-start;min-width:0}.item-symbol{flex:0 0 38px;height:38px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;color:var(--blue);font-size:17px}.item-main{flex:1;min-width:0}.item-title{font-weight:700;overflow-wrap:anywhere}.item-meta{color:var(--muted);font-size:12px;margin-top:4px}.item-note{font-size:13px;color:#c5d0d8;margin-top:7px;overflow-wrap:anywhere}.item-side{text-align:right;flex-shrink:0}.item-amount{font-weight:750;white-space:nowrap}.item-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:9px}.mini-btn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:9px;padding:5px 8px;font-size:11px}.status{font-size:10px;padding:4px 7px;border-radius:7px;display:inline-block;margin-top:6px;background:#293b48;color:#c4d9e8}.status.done{color:var(--green);background:#18382f}.status.high{color:var(--amber);background:#413522}.empty{border:1px dashed #3b4c58;border-radius:16px;padding:24px 18px;text-align:center;color:var(--muted);font-size:13px}.empty strong{display:block;color:var(--text);margin-bottom:5px}.bar-row{display:grid;grid-template-columns:100px 1fr auto;align-items:center;gap:10px;font-size:12px;margin:12px 0}.bar-label{color:var(--muted)}.bar-track{height:8px;border-radius:10px;background:#263540;overflow:hidden}.bar-fill{height:100%;border-radius:10px;background:var(--blue)}.bar-value{font-variant-numeric:tabular-nums}.tabs{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#111b23f2;border-top:1px solid #2b3a45;padding:8px 8px calc(8px + var(--safe-bottom));display:flex;justify-content:center;backdrop-filter:blur(18px)}.tab-row{display:grid;grid-template-columns:repeat(6,1fr);width:100%;max-width:700px;gap:2px}.tab{background:transparent;border:0;color:#8294a1;border-radius:12px;padding:7px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px}.tab .tab-icon{font-size:19px;line-height:1.2}.tab.active{color:var(--blue);background:#203546}.page-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:3px 0 17px}.page-title h2{margin:0;font-size:24px;letter-spacing:-.7px}.page-title p{margin:4px 0 0;color:var(--muted);font-size:13px}.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.search{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px;color:var(--text);margin-bottom:10px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}.field label{font-size:12px;color:#b7c5cf;font-weight:650}.field input,.field select,.field textarea{width:100%;min-width:0;background:#111c24;border:1px solid #344550;border-radius:11px;padding:12px;color:var(--text)}.field textarea{resize:vertical;min-height:76px}.field .hint{font-size:11px;color:var(--muted)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.span-2{grid-column:1/-1}.modal-backdrop{position:fixed;inset:0;z-index:30;background:#0009;display:flex;align-items:flex-end;justify-content:center;padding:0}.modal{width:100%;max-width:650px;max-height:92dvh;overflow:auto;background:#17232d;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:22px 18px calc(20px + var(--safe-bottom));box-shadow:0 -12px 50px #0005}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.modal-head h3{margin:0;font-size:20px}.form-actions{display:flex;gap:9px;margin-top:18px}.form-actions button{flex:1}.toast{position:fixed;z-index:50;bottom:calc(92px + var(--safe-bottom));left:50%;transform:translateX(-50%);background:#e8f3fc;color:#112432;padding:11px 16px;border-radius:12px;font-size:13px;font-weight:700;box-shadow:0 8px 30px #0004;max-width:90%;text-align:center}.hidden{display:none!important}.summary-box{background:var(--panel);border:1px solid var(--line);padding:16px;border-radius:17px;margin-bottom:12px}.summary-box h3{font-size:13px;color:var(--muted);margin:0 0 8px}.summary-big{font-size:25px;font-weight:800}.summary-small{font-size:12px;color:var(--muted);margin-top:4px}.notice{border:1px solid #66522d;background:#2c261b;color:#f3d8a3;padding:12px;border-radius:13px;font-size:12px;margin-bottom:14px}.settings-group{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px}.settings-row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:14px;background:var(--panel);border-bottom:1px solid var(--line)}.settings-row:last-child{border-bottom:0}.settings-row small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.settings-row button{flex-shrink:0}.footer-note{color:var(--muted);font-size:11px;text-align:center;margin:25px 0 5px}
    @media(min-width:720px){.topbar{padding-left:30px;padding-right:30px}main{padding:26px 30px}.stats-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.vehicle{padding:28px;min-height:220px}.vehicle h2{font-size:32px}.car-art{max-width:290px}.content-columns{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.modal-backdrop{align-items:center;padding:20px}.modal{border-radius:24px;padding:24px}.tabs{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid #2b3a45;padding:8px 20px}.app{padding-bottom:0}.tab-row{max-width:680px}.toast{bottom:25px}}
    @media(max-width:380px){main{padding:14px}.topbar{padding-left:14px;padding-right:14px}.vehicle{padding:17px}.vehicle h2{font-size:23px}.quick{font-size:10px}.item{padding:11px}.item-side .item-amount{font-size:13px}.form-grid{grid-template-columns:1fr}.span-2{grid-column:auto}}
  </style>

<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="mark">E39</div><div><div class="eyebrow">гараж · журнал автомобиля</div><h1>Моя E39</h1></div></div>
    <div class="top-actions"><button class="icon-btn" id="exportTop" title="Экспорт данных" aria-label="Экспорт данных">⇩</button><button class="icon-btn" id="settingsTop" title="Настройки" aria-label="Настройки">⚙</button></div>
  </header>
  <nav class="tabs" aria-label="Основная навигация"><div class="tab-row">
    <button class="tab active" data-page="home"><span class="tab-icon">⌂</span>Главная</button>
    <button class="tab" data-page="repairs"><span class="tab-icon">🔧</span>Ремонты</button>
    <button class="tab" data-page="parts"><span class="tab-icon">▦</span>Запчасти</button>
    <button class="tab" data-page="fuel"><span class="tab-icon">⛽</span>Топливо</button>
    <button class="tab" data-page="plan"><span class="tab-icon">◷</span>План</button>
    <button class="tab" data-page="stats"><span class="tab-icon">▥</span>Расходы</button>
  </div></nav>
  <main id="main"></main>
</div>
<div id="modalRoot"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
(() => {
  'use strict';
  const DB_KEY='e39-garage-db-v1';
  const today=()=>new Date().toISOString().slice(0,10);
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const num=v=>Number.isFinite(Number(v))?Number(v):0;
  const money=v=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(num(v));
  const dec=v=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(num(v));
  const dateFmt=v=>v?new Date(v+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'}):'Дата не указана';
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const defaultDB=()=>({version:1,vehicle:{name:'BMW E39',engine:'M52B20TU',gearbox:'ZF 5HP19',year:'',mileage:291000},repairs:[],parts:[],fuel:[],plan:[
    {id:uid(),title:'Замена радиатора',category:'Охлаждение',dueDate:'',dueMileage:0,priority:'high',estimate:0,status:'planned',notes:'',created:today()},
    {id:uid(),title:'Замена дополнительной помпы',category:'Охлаждение',dueDate:'',dueMileage:0,priority:'normal',estimate:0,status:'planned',notes:'',created:today()},
    {id:uid(),title:'Замена патрубков расширительного бачка',category:'Охлаждение',dueDate:'',dueMileage:0,priority:'normal',estimate:0,status:'planned',notes:'',created:today()},
    {id:uid(),title:'Замена масляного клапана',category:'Двигатель',dueDate:'',dueMileage:0,priority:'normal',estimate:0,status:'planned',notes:'',created:today()},
    {id:uid(),title:'Ремень и два ролика',category:'Привод',dueDate:'',dueMileage:0,priority:'normal',estimate:0,status:'planned',notes:'',created:today()},
    {id:uid(),title:'Замена масла и антифриза',category:'ТО',dueDate:'',dueMileage:0,priority:'high',estimate:0,status:'planned',notes:'',created:today()},
    {id:uid(),title:'Проверить тормозную жидкость',category:'Тормоза',dueDate:'',dueMileage:0,priority:'normal',estimate:0,status:'planned',notes:'',created:today()},
    {id:uid(),title:'Выставить руль / проверить сход-развал',category:'Подвеска',dueDate:'',dueMileage:0,priority:'normal',estimate:0,status:'planned',notes:'',created:today()}
  ],other:[],settings:{reminders:true}});
  function loadDB(){try{const raw=localStorage.getItem(DB_KEY);if(!raw)return defaultDB();const d=JSON.parse(raw);return {...defaultDB(),...d,vehicle:{...defaultDB().vehicle,...d.vehicle},settings:{reminders:true,...d.settings},repairs:d.repairs||[],parts:d.parts||[],fuel:d.fuel||[],plan:d.plan||[],other:d.other||[]}}catch(e){return defaultDB()}}
  let db=loadDB(),page='home',searchText='';
  function save(){try{localStorage.setItem(DB_KEY,JSON.stringify(db));return true}catch(e){toast('Не удалось сохранить данные. Освободи место на устройстве.');return false}}
  function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),2600)}
  function sum(a,k){return a.reduce((s,x)=>s+num(x[k]),0)}
  function expenses(){return [...db.repairs.map(x=>({date:x.date,amount:num(x.total),category:x.category||'Ремонт',label:x.title,kind:'repair'})),...db.fuel.map(x=>({date:x.date,amount:num(x.total),category:'Топливо',label:'Заправка',kind:'fuel'})),...db.parts.filter(x=>!x.repairId).map(x=>({date:x.date,amount:num(x.price)*num(x.quantity||1),category:'Запчасти',label:x.name,kind:'part'})),...db.other.map(x=>({date:x.date,amount:num(x.amount),category:x.category||'Прочее',label:x.title,kind:'other'}))]}
  function totalExpenses(){return sum(expenses(),'amount')}
  function latestMileage(){return Math.max(num(db.vehicle.mileage),...db.repairs.map(x=>num(x.mileage)),...db.fuel.map(x=>num(x.mileage)),...db.plan.map(x=>num(x.doneMileage)))}
  function monthExpenses(){const m=today().slice(0,7);return expenses().filter(x=>(x.date||'').startsWith(m)).reduce((s,x)=>s+x.amount,0)}
  function upcoming(){return db.plan.filter(x=>x.status==='planned').sort((a,b)=>priority(b.priority)-priority(a.priority)||((a.dueDate||'9999')<(b.dueDate||'9999')?-1:1))}
  function priority(p){return p==='high'?3:p==='low'?1:2}
  function isDue(p){return (p.dueDate&&p.dueDate<=today())||(p.dueMileage&&latestMileage()>=num(p.dueMileage))}
  function nav(p){page=p;searchText='';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render()}
  function btn(label,action,cls='btn'){return `<button class="${cls}" data-action="${action}">${label}</button>`}
  function empty(title,body,button=''){return `<div class="empty"><strong>${title}</strong>${body}${button?`<div style="margin-top:13px">${button}</div>`:''}</div>`}
  function itemCard(icon,title,meta,amount,body='',actions='',status=''){return `<article class="item"><div class="item-symbol">${icon}</div><div class="item-main"><div class="item-title">${esc(title)}</div><div class="item-meta">${meta}</div>${body?`<div class="item-note">${esc(body)}</div>`:''}${status?`<span class="status ${status.cls||''}">${status.text}</span>`:''}</div><div class="item-side">${amount!==''?`<div class="item-amount">${amount}</div>`:''}${actions?`<div class="item-actions">${actions}</div>`:''}</div></article>`}
  function renderHome(){const plans=upcoming().slice(0,3),recent=[...db.repairs.map(x=>({...x,_type:'repair'})),...db.fuel.map(x=>({...x,_type:'fuel',title:'Заправка',total:x.total,category:'Топливо'})),...db.other.map(x=>({...x,_type:'other',total:x.amount}))].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,4);const car=`<svg class="car-art" viewBox="0 0 300 130" role="img" aria-label="Силуэт седана"><defs><linearGradient id="paint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b6c9d7"/><stop offset=".45" stop-color="#6e879a"/><stop offset="1" stop-color="#344b5d"/></linearGradient></defs><path d="M24 83 L35 65 Q43 60 66 56 L95 31 Q105 22 128 22 L190 25 Q207 27 221 44 L247 57 Q265 60 274 73 L278 91 L266 99 L34 99 L20 91Z" fill="url(#paint)" stroke="#d4e2ec" stroke-width="1.4"/><path d="M75 55 L101 33 Q108 28 128 28 L151 29 L151 55Z" fill="#152a39" stroke="#8ca5b7"/><path d="M159 29 L188 31 Q202 33 214 47 L222 55 L159 55Z" fill="#152a39" stroke="#8ca5b7"/><path d="M35 67 L71 61 L82 68 L49 75Z" fill="#263d4e"/><path d="M225 61 L252 67 L263 77 L237 74Z" fill="#263d4e"/><path d="M24 81 L41 78 L47 86 L27 88Z" fill="#fff0ca"/><path d="M252 78 L272 80 L272 88 L252 87Z" fill="#ef7979"/><path d="M84 88 H217" stroke="#e2edf4" stroke-opacity=".65"/><circle cx="78" cy="94" r="20" fill="#0a1219" stroke="#667e8f" stroke-width="3"/><circle cx="78" cy="94" r="10" fill="#94a8b6"/><circle cx="78" cy="94" r="4" fill="#263a49"/><circle cx="224" cy="94" r="20" fill="#0a1219" stroke="#667e8f" stroke-width="3"/><circle cx="224" cy="94" r="10" fill="#94a8b6"/><circle cx="224" cy="94" r="4" fill="#263a49"/><path d="M50 105 H255" stroke="#8da8bb" stroke-width="2" opacity=".4"/></svg>`;
    return `<section class="vehicle"><div><div class="eyebrow">ТВОЙ АВТОМОБИЛЬ</div><h2>${esc(db.vehicle.name||'BMW E39')}</h2><p>${esc(db.vehicle.engine||'Двигатель не указан')} · ${esc(db.vehicle.gearbox||'КПП не указана')}</p><div class="meta"><span class="pill">Пробег ${dec(latestMileage())} км</span><span class="pill">Личный журнал</span></div></div>${car}</section>
    <div class="stats-grid"><div class="stat"><div class="stat-top"><span>Все расходы</span><span class="stat-icon">₽</span></div><div class="stat-value">${money(totalExpenses())}</div><div class="stat-note">За всё время учёта</div></div><div class="stat"><div class="stat-top"><span>В этом месяце</span><span class="stat-icon">↗</span></div><div class="stat-value">${money(monthExpenses())}</div><div class="stat-note">Все категории</div></div><div class="stat"><div class="stat-top"><span>Ремонты</span><span class="stat-icon">⚒</span></div><div class="stat-value">${db.repairs.length}</div><div class="stat-note">Записей в истории</div></div><div class="stat"><div class="stat-top"><span>Заправки</span><span class="stat-icon">⛽</span></div><div class="stat-value">${db.fuel.length}</div><div class="stat-note">Записей о топливе</div></div></div>
    <div class="section-head"><div><h2>Быстро добавить</h2><div class="sub">Запиши событие, пока не забыл</div></div></div><div class="quick-grid"><button class="quick" data-action="add-repair"><span>＋</span>Ремонт</button><button class="quick" data-action="add-part"><span>▦</span>Запчасть</button><button class="quick" data-action="add-fuel"><span>⛽</span>Заправка</button><button class="quick" data-action="add-plan"><span>◷</span>В план</button></div>

  function renderRepairs(){let arr=[...db.repairs].sort((a,b)=>(b.date||'').localeCompare(a.date||''));if(searchText)arr=arr.filter(x=>(x.title+' '+x.category+' '+x.notes+' '+x.partsUsed).toLowerCase().includes(searchText.toLowerCase()));return `<div class="page-title"><div><h2>История ремонтов</h2><p>Что сделано, когда и за сколько</p></div>${btn('+ Добавить','add-repair','btn primary')}</div><input class="search" id="searchBox" placeholder="Поиск по ремонту или заметкам…" value="${esc(searchText)}"><div class="summary-box"><h3>Затраты на ремонт</h3><div class="summary-big">${money(sum(db.repairs,'total'))}</div><div class="summary-small">${db.repairs.length} записей · детали и работа</div></div><div class="card-list">${arr.length?arr.map(x=>itemCard('🔧',x.title,`${dateFmt(x.date)} · ${x.mileage?dec(x.mileage)+' км':'пробег не указан'}${x.category?' · '+x.category:''}`,money(x.total),[x.partsUsed,x.notes].filter(Boolean).join(' — '),`<button class="mini-btn" data-action="edit-repair" data-id="${x.id}">Изменить</button><button class="mini-btn" data-action="delete" data-type="repairs" data-id="${x.id}">Удалить</button>`)).join(''):empty('Записей о ремонте нет','Добавь выполненную работу — история начнёт формироваться здесь.',btn('Добавить ремонт','add-repair','btn primary'))}</div>`}
  function renderParts(){let arr=[...db.parts].sort((a,b)=>(b.date||'').localeCompare(a.date||''));if(searchText)arr=arr.filter(x=>(x.name+' '+x.brand+' '+x.partNo+' '+x.notes).toLowerCase().includes(searchText.toLowerCase()));const installed=arr.filter(x=>x.status==='installed').length;return `<div class="page-title"><div><h2>Запчасти</h2><p>Артикулы, покупки и установка</p></div>${btn('+ Добавить','add-part','btn primary')}</div><div class="stats-grid"><div class="stat"><div class="stat-top">Позиций</div><div class="stat-value">${db.parts.length}</div></div><div class="stat"><div class="stat-top">Установлено</div><div class="stat-value">${installed}</div></div><div class="stat"><div class="stat-top">Куплено на</div><div class="stat-value">${money(sum(db.parts.map(x=>({v:num(x.price)*num(x.quantity||1)})),'v'))}</div></div><div class="stat"><div class="stat-top">Ожидают установки</div><div class="stat-value">${arr.filter(x=>x.status==='bought').length}</div></div></div><input class="search" id="searchBox" placeholder="Поиск по названию, бренду или артикулу" value="${esc(searchText)}"><div class="card-list">${arr.length?arr.map(x=>itemCard('▦',x.name,`${dateFmt(x.date)}${x.brand?' · '+x.brand:''}${x.partNo?' · '+x.partNo:''} · Кол-во: ${x.quantity||1}`,money(num(x.price)*num(x.quantity||1)),[x.status==='installed'?'Установлена':x.status==='bought'?'Куплена, не установлена':'Запланирована',x.notes].filter(Boolean).join(' · '),`<button class="mini-btn" data-action="edit-part" data-id="${x.id}">Изменить</button><button class="mini-btn" data-action="delete" data-type="parts" data-id="${x.id}">Удалить</button>`,{text:x.status==='installed'?'Установлена':x.status==='bought'?'На складе':'В планах',cls:x.status==='installed'?'done':''})).join(''):empty('Каталог запчастей пуст','Добавь деталь с артикулом, ценой и статусом.',btn('Добавить запчасть','add-part','btn primary'))}</div>`}
  function renderFuel(){let arr=[...db.fuel].sort((a,b)=>(b.date||'').localeCompare(a.date||''));if(searchText)arr=arr.filter(x=>(x.station+' '+x.notes).toLowerCase().includes(searchText.toLowerCase()));const liters=sum(db.fuel,'liters'),cost=sum(db.fuel,'total');const mileageEntries=db.fuel.filter(x=>num(x.mileage)>0).sort((a,b)=>a.mileage-b.mileage);let consumption='—';if(mileageEntries.length>=2){const first=mileageEntries[0],last=mileageEntries[mileageEntries.length-1],between=mileageEntries.slice(1).reduce((s,x)=>s+num(x.liters),0),distance=num(last.mileage)-num(first.mileage);if(distance>0)consumption=dec(between/distance*100)+' л/100 км'}return `<div class="page-title"><div><h2>Топливо</h2><p>Заправки, цена и средний расход</p></div>${btn('+ Заправка','add-fuel','btn primary')}</div><div class="stats-grid"><div class="stat"><div class="stat-top">Потрачено</div><div class="stat-value">${money(cost)}</div></div><div class="stat"><div class="stat-top">Залито</div><div class="stat-value">${dec(liters)} л</div></div><div class="stat"><div class="stat-top">Средняя цена</div><div class="stat-value">${liters?money(cost/liters):'—'}</div><div class="stat-note">за литр</div></div><div class="stat"><div class="stat-top">Расход</div><div class="stat-value">${consumption}</div><div class="stat-note">оценка по пробегу</div></div></div><div class="notice">Для точного расхода записывай пробег при каждой заправке и желательно заправляй полный бак. Расчёт по неполным данным может быть неточным.</div><input class="search" id="searchBox" placeholder="Поиск по АЗС или заметкам" value="${esc(searchText)}"><div class="card-list">${arr.length?arr.map(x=>itemCard('⛽',x.station||'Заправка',`${dateFmt(x.date)} · ${dec(x.liters)} л × ${money(x.pricePerLiter)}/л${x.mileage?' · '+dec(x.mileage)+' км':''}`,money(x.total),x.notes,`<button class="mini-btn" data-action="edit-fuel" data-id="${x.id}">Изменить</button><button class="mini-btn" data-action="delete" data-type="fuel" data-id="${x.id}">Удалить</button>`)).join(''):empty('Заправок пока нет','Добавляй объём, цену за литр и пробег.',btn('Добавить заправку','add-fuel','btn primary'))}</div>`}
  function renderPlan(){const active=upcoming(),done=db.plan.filter(x=>x.status==='done');return `<div class="page-title"><div><h2>План работ</h2><p>Будущее обслуживание и бюджет</p></div>${btn('+ Добавить','add-plan','btn primary')}</div><div class="stats-grid"><div class="stat"><div class="stat-top">В плане</div><div class="stat-value">${active.length}</div></div><div class="stat"><div class="stat-top">Пора проверить</div><div class="stat-value">${active.filter(isDue).length}</div></div><div class="stat"><div class="stat-top">Плановый бюджет</div><div class="stat-value">${money(sum(active,'estimate'))}</div></div><div class="stat"><div class="stat-top">Выполнено</div><div class="stat-value">${done.length}</div></div></div><div class="section-head"><div><h2>Предстоящие работы</h2><div class="sub">Сначала срочные задачи</div></div></div><div class="card-list">${active.length?active.map(x=>itemCard('◷',x.title,`${x.category||'Обслуживание'} · ${x.dueDate?'до '+dateFmt(x.dueDate):'дата не задана'}${x.dueMileage?' · '+dec(x.dueMileage)+' км':''}`,x.estimate?money(x.estimate):'Бюджет не задан',x.notes,`<button class="mini-btn" data-action="complete-plan" data-id="${x.id}">Выполнено</button><button class="mini-btn" data-action="edit-plan" data-id="${x.id}">Изменить</button><button class="mini-btn" data-action="delete" data-type="plan" data-id="${x.id}">Удалить</button>`,isDue(x)?{text:'Срок наступил',cls:'high'}:{text:x.priority==='high'?'Высокий приоритет':x.priority==='low'?'Низкий приоритет':'Обычный'})).join(''):empty('План пуст','Добавь работы, которые предстоит выполнить.',btn('Добавить работу','add-plan','btn primary'))}</div>${done.length?`<div class="section-head"><div><h2>Выполненные задачи</h2><div class="sub">${done.length} работ</div></div></div><div class="card-list">${done.sort((a,b)=>(b.doneDate||'').localeCompare(a.doneDate||'')).map(x=>itemCard('✓',x.title,`Выполнено ${dateFmt(x.doneDate)}${x.doneMileage?' · '+dec(x.doneMileage)+' км':''}`,x.actualCost?money(x.actualCost):'',x.notes,`<button class="mini-btn" data-action="edit-plan" data-id="${x.id}">Открыть</button>`,{text:'Выполнено',cls:'done'})).join('')}</div>`:''}`}
  function renderStats(){const all=expenses(),cats={};all.forEach(x=>cats[x.category]=(cats[x.category]||0)+x.amount);const sorted=Object.entries(cats).sort((a,b)=>b[1]-a[1]),max=sorted[0]?.[1]||1;const years={};all.forEach(x=>{const y=(x.date||'Без даты').slice(0,4);years[y]=(years[y]||0)+x.amount});const months={};all.forEach(x=>{if(x.date){const m=x.date.slice(0,7);months[m]=(months[m]||0)+x.amount}});const monthRows=Object.entries(months).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,6);return `<div class="page-title"><div><h2>Расходы</h2><p>Финансовая картина содержания E39</p></div>${btn('＋ Расход','add-other','btn primary')}</div><div class="stats-grid"><div class="stat"><div class="stat-top">Всего учтено</div><div class="stat-value">${money(totalExpenses())}</div></div><div class="stat"><div class="stat-top">В этом месяце</div><div class="stat-value">${money(monthExpenses())}</div></div><div class="stat"><div class="stat-top">Ремонты</div><div class="stat-value">${money(sum(db.repairs,'total'))}</div></div><div class="stat"><div class="stat-top">Топливо</div><div class="stat-value">${money(sum(db.fuel,'total'))}</div></div></div><div class="content-columns"><section><div class="section-head"><div><h2>По категориям</h2><div class="sub">Все записанные расходы</div></div></div><div class="summary-box">${sorted.length?sorted.map(([name,val])=>`<div class="bar-row"><div class="bar-label">${esc(name)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(1,val/max*100)}%"></div></div><div class="bar-value">${money(val)}</div></div>`).join(''):empty('Пока нет данных','Расходы появятся после добавления записей.')}</div><div class="section-head"><div><h2>По месяцам</h2><div class="sub">Последние месяцы с записями</div></div></div><div class="card-list">${monthRows.length?monthRows.map(([m,v])=>itemCard('▥',new Date(m+'-15T12:00:00').toLocaleDateString('ru-RU',{month:'long',year:'numeric'}),'Сумма расходов',money(v))).join(''):empty('Нет месячной статистики','Добавь первую запись о расходе.')}</div></section><section><div class="section-head"><div><h2>Прочие расходы</h2><div class="sub">Мойка, страховка, налоги и другое</div></div></div><div class="card-list">${db.other.length?[...db.other].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>itemCard('₽',x.title,`${dateFmt(x.date)} · ${x.category}`,money(x.amount),x.notes,`<button class="mini-btn" data-action="edit-other" data-id="${x.id}">Изменить</button><button class="mini-btn" data-action="delete" data-type="other" data-id="${x.id}">Удалить</button>`)).join(''):empty('Прочих расходов нет','Добавляй страховку, мойку, налоги и любые другие траты.',btn('Добавить расход','add-other','btn primary'))}</div></section></div>`}
  function renderSettings(){return `<div class="page-title"><div><h2>Настройки и данные</h2><p>Резервные копии и параметры автомобиля</p></div></div><div class="summary-box"><h3>Автомобиль</h3><div class="summary-big">${esc(db.vehicle.name)}</div><div class="summary-small">${esc(db.vehicle.engine)} · ${esc(db.vehicle.gearbox)}</div><div style="margin-top:13px">${btn('Изменить данные авто','edit-vehicle','btn')}</div></div><div class="settings-group"><div class="settings-row"><div><strong>Экспорт резервной копии</strong><small>Скачать все записи в JSON</small></div>${btn('Экспорт','export','btn')}</div><div class="settings-row"><div><strong>Экспорт таблицы расходов</strong><small>CSV для Excel / Numbers</small></div>${btn('Скачать CSV','export-csv','btn')}</div><div class="settings-row"><div><strong>Восстановить резервную копию</strong><small>Заменить текущие данные файлом JSON</small></div><button class="btn" data-action="import">Импорт</button><input type="file" id="importFile" accept=".json,application/json" class="hidden"></div><div class="settings-row"><div><strong>Напоминания</strong><small>Проверка сроков при открытии приложения</small></div><button class="btn" data-action="toggle-reminders">${db.settings.reminders?'Включены':'Выключены'}</button></div></div><div class="notice">Приложение хранит данные в локальном хранилище браузера. Очистка данных Safari, удаление сайта или смена устройства могут привести к потере записей. Регулярно сохраняй резервную копию.</div><div class="settings-group"><div class="settings-row"><div><strong>Установить на iPhone</strong><small>Открой опубликованный HTTPS-адрес в Safari → «Поделиться» → «На экран Домой».</small></div><span>ⓘ</span></div><div class="settings-row"><div><strong>Сбросить демо-данные и записи</strong><small>Удаляет текущую локальную базу без возможности отмены</small></div><button class="btn danger" data-action="reset">Сброс</button></div></div><div class="footer-note">Моя E39 · версия 1.0 · локальное хранение</div>`}
  function render(){const main=document.getElementById('main');main.innerHTML=({home:renderHome,repairs:renderRepairs,parts:renderParts,fuel:renderFuel,plan:renderPlan,stats:renderStats,settings:renderSettings}[page]||renderHome)();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(db.settings.reminders&&page!=='settings'){const due=upcoming().filter(isDue);if(due.length&& !sessionStorage.getItem('e39-due-'+today())){sessionStorage.setItem('e39-due-'+today(),'1');setTimeout(()=>toast(`Есть работы, которые пора проверить: ${due.length}`),450)}}}
  function field(label,name,type='text',value='',opts={}){const required=opts.required?'required':'';const placeholder=opts.placeholder?`placeholder="${esc(opts.placeholder)}"`:'';const min=opts.min!==undefined?`min="${opts.min}"`:'';const step=opts.step?`step="${opts.step}"`:'';const cls=opts.span?'span-2':'';let input='';if(type==='textarea')input=`<textarea name="${name}" ${placeholder}>${esc(value)}</textarea>`;else if(type==='select')input=`<select name="${name}" ${required}>${opts.options.map(o=>`<option value="${esc(o.value)}" ${String(value)===String(o.value)?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;else input=`<input name="${name}" type="${type}" value="${esc(value)}" ${placeholder} ${required} ${min} ${step}>`;return `<div class="field ${cls}"><label for="f-${name}">${label}</label>${input}</div>`}
  function openModal(title,body,onSave,saveLabel='Сохранить'){const root=document.getElementById('modalRoot');root.innerHTML=`<div class="modal-backdrop" id="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" data-action="close-modal" aria-label="Закрыть">×</button></div><form id="editForm">${body}<div class="form-actions"><button type="button" class="btn ghost" data-action="close-modal">Отмена</button><button type="submit" class="btn primary">${saveLabel}</button></div></form></section></div>`;root.querySelector('#backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')closeModal()});root.querySelector('#editForm').addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());if(onSave(data)!==false){save();closeModal();render()}});root.querySelector('input,select,textarea')?.focus()}
  function closeModal(){document.getElementById('modalRoot').innerHTML=''}
  function getRecord(type,id){return db[type].find(x=>x.id===id)||{}}
  function addRepair(id){const x=id?getRecord('repairs',id):{date:today(),mileage:latestMileage(),category:'Двигатель',total:0};openModal(id?'Изменить ремонт':'Добавить ремонт',`<div class="form-grid">${field('Что сделано *','title','text',x.title||'',{required:true,span:true,placeholder:'Например, замена помпы'})}${field('Дата','date','date',x.date||today())}${field('Пробег, км','mileage','number',x.mileage??latestMileage(),{min:0,step:'1'})}${field('Категория','category','select',x.category||'Двигатель',{options:['Двигатель','Охлаждение','Подвеска','Трансмиссия','Тормоза','Электрика','Кузов','ТО','Другое'].map(v=>({value:v,label:v}))})}${field('Общая стоимость, ₽ *','total','number',x.total??0,{required:true,min:0,step:'0.01'})}${field('Запчасти / артикулы','partsUsed','textarea',x.partsUsed||'',{span:true,placeholder:'Что установлено, номера деталей'})}${field('Заметки','notes','textarea',x.notes||'',{span:true,placeholder:'Симптомы, нюансы, следующий осмотр'})}</div>`,d=>{if(!d.title.trim())return false;const rec={...x,...d,id:id||uid(),mileage:num(d.mileage),total:num(d.total),date:d.date||today()};if(id)db.repairs=db.repairs.map(a=>a.id===id?rec:a);else db.repairs.push(rec);if(rec.mileage>num(db.vehicle.mileage))db.vehicle.mileage=rec.mileage;toast(id?'Ремонт обновлён':'Ремонт сохранён')} )}
  function addPart(id){const x=id?getRecord('parts',id):{date:today(),quantity:1,price:0,status:'bought'};openModal(id?'Изменить запчасть':'Добавить запчасть',`<div class="form-grid">${field('Название *','name','text',x.name||'',{required:true,span:true,placeholder:'Например, радиатор охлаждения'})}${field('Дата покупки','date','date',x.date||today())}${field('Производитель','brand','text',x.brand||'',{placeholder:'Mahle, INA…'})}${field('Артикул','partNo','text',x.partNo||'')}${field('Количество','quantity','number',x.quantity??1,{min:1,step:'1'})}${field('Цена за штуку, ₽','price','number',x.price??0,{min:0,step:'0.01'})}${field('Статус','status','select',x.status||'bought',{options:[{value:'planned',label:'Запланирована к покупке'},{value:'bought',label:'Куплена, не установлена'},{value:'installed',label:'Установлена'}]})}${field('Связанный ремонт (необязательно)','repairId','select',x.repairId||'',{span:true,options:[{value:'',label:'Не привязывать'},...db.repairs.map(r=>({value:r.id,label:r.title+' — '+dateFmt(r.date)}))]})}${field('Магазин / ссылка / заметки','notes','textarea',x.notes||'',{span:true})}</div>`,d=>{if(!d.name.trim())return false;const rec={...x,...d,id:id||uid(),quantity:Math.max(1,num(d.quantity)),price:num(d.price),date:d.date||today()};if(id)db.parts=db.parts.map(a=>a.id===id?rec:a);else db.parts.push(rec);toast(id?'Запчасть обновлена':'Запчасть сохранена')})}
  function addFuel(id){const x=id?getRecord('fuel',id):{date:today(),liters:0,pricePerLiter:0,mileage:latestMileage()};openModal(id?'Изменить заправку':'Добавить заправку',`<div class="form-grid">${field('Дата','date','date',x.date||today())}${field('АЗС','station','text',x.station||'',{placeholder:'Название АЗС'})}${field('Объём, л *','liters','number',x.liters??'',{required:true,min:0.01,step:'0.01'})}${field('Цена за литр, ₽ *','pricePerLiter','number',x.pricePerLiter??'',{required:true,min:0,step:'0.01'})}${field('Итого, ₽','total','number',x.total??'',{min:0,step:'0.01'})}${field('Пробег, км','mileage','number',x.mileage??latestMileage(),{min:0,step:'1'})}${field('Заметки','notes','textarea',x.notes||'',{span:true,placeholder:'Полный бак, тип топлива и т. п.'})}</div><div class="hint">Если итог не указан, он рассчитывается по объёму и цене за литр.</div>`,d=>{if(num(d.liters)<=0||num(d.pricePerLiter)<0)return false;const total=d.total!==''?num(d.total):num(d.liters)*num(d.pricePerLiter);const rec={...x,...d,id:id||uid(),liters:num(d.liters),pricePerLiter:num(d.pricePerLiter),total,mileage:num(d.mileage),date:d.date||today()};if(id)db.fuel=db.fuel.map(a=>a.id===id?rec:a);else db.fuel.push(rec);if(rec.mileage>num(db.vehicle.mileage))db.vehicle.mileage=rec.mileage;toast(id?'Заправка обновлена':'Заправка сохранена')})}
  function addPlan(id){const x=id?getRecord('plan',id):{date:today(),dueDate:'',dueMileage:0,priority:'normal',estimate:0,status:'planned',category:'Обслуживание'};openModal(id?'Изменить задачу':'Добавить работу в план',`<div class="form-grid">${field('Работа *','title','text',x.title||'',{required:true,span:true,placeholder:'Например, замена масла'})}${field('Категория','category','select',x.category||'Обслуживание',{options:['Обслуживание','Двигатель','Охлаждение','Подвеска','Трансмиссия','Тормоза','Электрика','Кузов','Другое'].map(v=>({value:v,label:v}))})}${field('Приоритет','priority','select',x.priority||'normal',{options:[{value:'high',label:'Высокий'},{value:'normal',label:'Обычный'},{value:'low',label:'Низкий'}]})}${field('Срок по дате','dueDate','date',x.dueDate||'')}${field('Срок по пробегу, км','dueMileage','number',x.dueMileage||'',{min:0,step:'1'})}${field('Ожидаемые затраты, ₽','estimate','number',x.estimate??0,{min:0,step:'0.01'})}${field('Заметки','notes','textarea',x.notes||'',{span:true,placeholder:'Что проверить, какие детали нужны'})}</div>`,d=>{if(!d.title.trim())return false;const rec={...x,...d,id:id||uid(),estimate:num(d.estimate),dueMileage:num(d.dueMileage),status:x.status||'planned',created:x.created||today()};if(id)db.plan=db.plan.map(a=>a.id===id?rec:a);else db.plan.push(rec);toast(id?'Задача обновлена':'Работа добавлена в план')})}
  function completePlan(id){const x=getRecord('plan',id);openModal('Отметить работу выполненной',`<div class="summary-box"><strong>${esc(x.title)}</strong><div class="summary-small">Задача будет перенесена в выполненные. При желании можно указать фактические расходы.</div></div><div class="form-grid">${field('Дата выполнения','doneDate','date',today())}${field('Пробег, км','doneMileage','number',latestMileage(),{min:0,step:'1'})}${field('Фактические затраты, ₽','actualCost','number',x.actualCost??x.estimate??0,{min:0,step:'0.01'})}<div class="span-2">${field('Комментарий','notes','textarea',x.notes||'')}</div></div>`,d=>{db.plan=db.plan.map(a=>a.id===id?{...a,...d,status:'done',doneDate:d.doneDate||today(),doneMileage:num(d.doneMileage),actualCost:num(d.actualCost)}:a);if(num(d.doneMileage)>num(db.vehicle.mileage))db.vehicle.mileage=num(d.doneMileage);if(num(d.actualCost)>0)db.other.push({id:uid(),date:d.doneDate||today(),title:'Выполнено: '+x.title,category:'Ремонт по плану',amount:num(d.actualCost),notes:'Создано из плана обслуживания'});toast('Работа отмечена выполненной')},'Подтвердить')}
  function addOther(id){const x=id?getRecord('other',id):{date:today(),amount:0,category:'Прочее'};openModal(id?'Изменить расход':'Добавить расход',`<div class="form-grid">${field('Название *','title','text',x.title||'',{required:true,span:true,placeholder:'Например, ОСАГО или мойка'})}${field('Дата','date','date',x.date||today())}${field('Категория','category','select',x.category||'Прочее',{options:['Прочее','Мойка','Страховка','Налог','Шиномонтаж','Парковка','Ремонт по плану','Инструменты','Другое'].map(v=>({value:v,label:v}))})}${field('Сумма, ₽ *','amount','number',x.amount??'',{required:true,min:0,step:'0.01'})}${field('Заметки','notes','textarea',x.notes||'',{span:true})}</div>`,d=>{if(!d.title.trim())return false;const rec={...x,...d,id:id||uid(),amount:num(d.amount),date:d.date||today()};if(id)db.other=db.other.map(a=>a.id===id?rec:a);else db.other.push(rec);toast(id?'Расход обновлён':'Расход сохранён')})}
  function editVehicle(){openModal('Данные автомобиля',`<div class="form-grid">${field('Название','name','text',db.vehicle.name,{required:true})}${field('Год выпуска','year','number',db.vehicle.year||'',{min:1980,max:2035,step:'1'})}${field('Двигатель','engine','text',db.vehicle.engine)}${field('Коробка передач','gearbox','text',db.vehicle.gearbox)}${field('Текущий пробег, км','mileage','number',db.vehicle.mileage,{min:0,step:'1',span:true})}</div>`,d=>{db.vehicle={...db.vehicle,...d,mileage:num(d.mileage)};toast('Данные автомобиля обновлены')})}
  function exportJSON(){const blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});download(blob,`e39-backup-${today()}.json`);toast('Резервная копия подготовлена')}
  function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
  function exportCSV(){const rows=[['Дата','Тип','Название','Категория','Пробег км','Количество/литры','Цена за единицу','Сумма ₽','Заметки']];db.repairs.forEach(x=>rows.push([x.date,'Ремонт',x.title,x.category,x.mileage,'','',x.total,x.notes]));db.parts.forEach(x=>rows.push([x.date,'Запчасть',x.name,x.brand,x.partNo,x.quantity,x.price,num(x.quantity||1)*num(x.price),x.notes]));db.fuel.forEach(x=>rows.push([x.date,'Топливо',x.station,'Топливо',x.mileage,x.liters,x.pricePerLiter,x.total,x.notes]));db.other.forEach(x=>rows.push([x.date,'Расход',x.title,x.category,'','','',x.amount,x.notes]));const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),`e39-expenses-${today()}.csv`);toast('CSV-файл подготовлен')}
  function doImport(){document.getElementById('importFile')?.click()}
  function handleImport(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!x||!Array.isArray(x.repairs)||!Array.isArray(x.parts)||!Array.isArray(x.fuel)||!Array.isArray(x.plan))throw new Error('Неверный формат');if(!confirm('Импорт заменит текущие записи. Продолжить?'))return;db={...defaultDB(),...x};save();render();toast('Резервная копия восстановлена')}catch(e){toast('Не удалось прочитать файл резервной копии')}};reader.readAsText(file)}
  function deleteRecord(type,id){const labels={repairs:'ремонт',parts:'запчасть',fuel:'заправку',plan:'задачу',other:'расход'};if(!confirm(`Удалить ${labels[type]||'запись'}? Это действие нельзя отменить.`))return;db[type]=db[type].filter(x=>x.id!==id);save();render();toast('Запись удалена')}
  document.addEventListener('click',e=>{const tab=e.target.closest('[data-page]');if(tab){nav(tab.dataset.page);return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;switch(a){case'add-repair':addRepair();break;case'edit-repair':addRepair(id);break;case'add-part':addPart();break;case'edit-part':addPart(id);break;case'add-fuel':addFuel();break;case'edit-fuel':addFuel(id);break;case'add-plan':addPlan();break;case'edit-plan':addPlan(id);break;case'complete-plan':completePlan(id);break;case'add-other':addOther();break;case'edit-other':addOther(id);break;case'delete':deleteRecord(b.dataset.type,id);break;case'go-plan':nav('plan');break;case'go-repairs':nav('repairs');break;case'close-modal':closeModal();break;case'export':case'exportTop':exportJSON();break;case'export-csv':exportCSV();break;case'import':doImport();break;case'edit-vehicle':editVehicle();break;case'toggle-reminders':db.settings.reminders=!db.settings.reminders;save();render();toast(db.settings.reminders?'Проверка сроков включена':'Проверка сроков выключена');break;case'reset':if(confirm('Удалить ВСЕ локальные записи и восстановить исходный план? Сначала сделай экспорт, если данные нужны.')){db=defaultDB();save();nav('home');toast('Локальная база сброшена')}break;}}
  );
  document.addEventListener('input',e=>{if(e.target.id==='searchBox'){const pos=e.target.selectionStart;searchText=e.target.value;render();const n=document.getElementById('searchBox');n?.focus();n?.setSelectionRange(pos,pos)}});
  document.getElementById('exportTop').addEventListener('click',exportJSON);document.getElementById('settingsTop').addEventListener('click',()=>nav('settings'));
  document.addEventListener('change',e=>{if(e.target.id==='importFile')handleImport(e.target.files?.[0])});
  if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  render();
})();
</script>
</body>
